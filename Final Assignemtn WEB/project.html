<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Flowdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<style>
 
  /* Same palette as the dashboard, so both pages match. */
  :root{
    --bg:        #F5F3FB;
    --bg-2:      #EFEBFA;
    --card:      #FFFFFF;
    --ink:       #2B2740;
    --muted:     #8B87A3;
    --line:      #E7E2F5;
 
    --blue:      #6E8FE8;
    --blue-soft: #A9C6FF;
    --purple:    #A96FE0;
    --purple-soft:#C9A9EF;
    --pink:      #F17FA8;
    --pink-soft: #FFC9E0;
    --mint:      #3FB88F;
    --mint-soft: #AEEBD4;
    --amber:     #E0A230;
    --amber-soft:#FFE1A8;
  }
 
  *{ box-sizing: border-box; margin: 0; padding: 0; }
 
  body{
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    min-height: 100vh;
  }
 
  /* ============ SIDEBAR (same as dashboard) ============ */
  .sidebar{
    width: 250px;
    flex-shrink: 0;
    padding: 28px 20px;
    border-right: 1px solid var(--line);
    background: var(--bg-2);
  }
 
  .brand{ display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
 
  .brand-mark{
    width: 38px; height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blue-soft), var(--purple-soft));
    color: #fff; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
 
  .brand-name{ font-size: 18px; font-weight: 800; }
  .brand-sub{ font-size: 11px; color: var(--muted); font-weight: 600; }
 
  .nav-label{
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 700; margin: 20px 10px 8px;
  }
  .nav-label:first-of-type{ margin-top: 0; }
 
  .nav-item{
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    color: var(--muted); font-size: 14px; font-weight: 600;
    text-decoration: none;
  }
 
  .nav-item.active{
    background: linear-gradient(120deg, var(--blue-soft), var(--purple-soft));
    color: #fff;
  }
 
  .nav-item .badge{
    margin-left: auto; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
    background: var(--mint-soft); color: #1a5c46;
  }
  .nav-item.active .badge{ background: rgba(255,255,255,0.35); color: #fff; }
 
  /* ============ MAIN ============ */
  main{ flex: 1; padding: 28px 36px 48px; max-width: 1200px; }
 
  .topbar{ display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
 
  .search{
    flex: 1; max-width: 400px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 16px;
    color: var(--muted); font-size: 14px;
  }
 
  .avatar{
    margin-left: auto; width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--amber-soft), var(--pink-soft));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #6b3f1a;
  }
 
  .page-head{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
  }
 
  .page-title{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; }
  .page-sub{ color: var(--muted); font-size: 14px; margin-top: 4px; }
 
  .new-btn{
    background: linear-gradient(120deg, var(--blue-soft), var(--purple-soft));
    color: #fff; font-weight: 700; font-size: 13.5px;
    padding: 10px 18px; border-radius: 12px;
    text-decoration: none;
  }
 
  /* ============ PROJECT CARDS ============ */
  .project-grid{
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 600px;
  }
 
  .project-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
 
  .project-top{
    display: none;
  }
 
  .project-icon{
    display: none;
  }
 
  .tag{
    font-size: 15px; font-weight: 700; padding: 0px; margin-left: 6px; border-radius: 0px; background: none; color: var(--muted);
  }
  .tag-active{ background: none }
  .tag-risk{ background: none }
  .tag-done{ background: none }
 
  .project-name{ font-weight: 700; font-size: 14px; margin-bottom: 2px; display: inline; }
  .project-desc{ color: var(--muted); font-size: 12px; margin-bottom: 8px; display: block; }
 
  .progress-label{
    display: none;
  }
  .progress-label .pct{ font-family: 'JetBrains Mono'; color: var(--ink); }
 
  .progress-track{
    display: none;
  }
  .progress-fill{ height: 100%; border-radius: 20px; }
 
  .project-foot{
    display: inline;
    font-size: 12px; color: var(--muted);
  }
 
  .project-foot .due{ font-family: 'JetBrains Mono'; }
</style>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">F</div>
    <div>
      <div class="brand-name">Flowdesk</div>
      <div class="brand-sub">Projects &amp; IT</div>
    </div>
  </div>

  <div class="nav-label">Workspace</div>
  <a class="nav-item" href="flowdesk-simple.html">Dashboard</a>
  <a class="nav-item active" href="project.html">Projects</a>
  <a class="nav-item" href="tasks.html">Tasks</a>
  <a class="nav-item" href="sprints.html">Sprints</a>
</aside>

<main>

  <div class="topbar">
    <div class="search">Search projects...</div>
    <div class="avatar">PS</div>
  </div>

  <div class="page-head">
    <div>
      <div class="page-title">Projects</div>
      <div class="page-sub">6 active projects across the team.</div>
    </div>
    <a class="new-btn" href="#">+ New Project</a>
  </div>

  <div class="project-grid">

    <div class="project-card">
      <span class="project-name">Atlas Redesign</span> <span class="tag tag-active">Active</span> 
    </div>

    <div class="project-card">
      <span class="project-name">Core Platform</span> <span class="tag tag-active">Active</span>
    </div>

    <div class="project-card">
      <span class="project-name">Migration to Cloud</span> <span class="tag tag-risk">At Risk</span>
    </div>

    <div class="project-card">
      <span class="project-name">Mobile App v3</span> <span class="tag tag-active">Active</span>
    </div>

    <div class="project-card">
      <span class="project-name">Security Audit</span> <span class="tag tag-done">Completed</span>
    </div>

    <div class="project-card">
      <span class="project-name">HR Portal Revamp</span> <span class="tag tag-active">Active</span>
    </div>

  </div>

</main>
</body>
</html>
