<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
        }

        td {
            border: 1px solid #000;
            padding: 10px;
            vertical-align: middle;
        }

        td.label-cell {
            width: 25%;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 95%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #999;
            border-radius: 3px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .buttons {
            text-align: center;
            padding-top: 10px;
        }

        .buttons input {
            width: 90px;
            margin: 0 5px;
            padding: 6px 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Student Registration Form</h1>
        <form>
            <table>
                <tr>
                    <td class="label-cell">Student ID</td>
                    <td><input type="text" id="student-id" name="student-id" required></td>
                </tr>
                <tr>
                    <td class="label-cell">First Name</td>
                    <td><input type="text" id="first-name" name="first-name" required></td>
                </tr>
                <tr>
                    <td class="label-cell">Last Name</td>
                    <td><input type="text" id="last-name" name="last-name" required></td>
                </tr>
                <tr>
                    <td class="label-cell">Gender</td>
                    <td>
                        <label><input type="radio" id="male" name="gender" value="male" required> Male</label>
                        <label style="margin-left: 20px;"><input type="radio" id="female" name="gender" value="female" required> Female</label>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Date of Birth</td>
                    <td><input type="date" id="date-of-birth" name="date-of-birth"></td>
                </tr>
                <tr>
                    <td class="label-cell">Email</td>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <td class="label-cell">Phone</td>
                    <td><input type="tel" id="phone-number" name="phone-number"></td>
                </tr>
                <tr>
                    <td class="label-cell">Address</td>
                    <td><textarea id="address" name="address"></textarea></td>
                </tr>
                <tr>
                    <td class="label-cell">Course</td>
                    <td>
                        <select id="course" name="course">
                            <option value="">Select Course</option>
                            <option value="computer-science">Computer Science</option>
                            <option value="business-administration">Business Administration</option>
                            <option value="psychology">Psychology</option>
                            <option value="engineering">Engineering</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Photo</td>
                    <td><input type="file" id="photo" name="photo"></td>
                </tr>
                <tr>
                    <td colspan="2" class="buttons">
                        <input type="submit" value="Save">
                        <input type="reset" value="Clear">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
